<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billboard Tree — GLB preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% 28%, #2d7a68 0%, #123b34 42%, #071b18 76%, #030d0b 100%);
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
      import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

      const params = new URLSearchParams(location.search);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(900, 1050);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.shadowMap.enabled = false;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      // Painted sky backdrop: deep teal edges, warm moss glow behind the crown.
      const skyCanvas = document.createElement('canvas');
      skyCanvas.width = 900;
      skyCanvas.height = 1050;
      const skyCtx = skyCanvas.getContext('2d');
      const skyGrad = skyCtx.createRadialGradient(430, 300, 40, 450, 430, 760);
      skyGrad.addColorStop(0, '#3f947c');
      skyGrad.addColorStop(0.24, '#27695b');
      skyGrad.addColorStop(0.52, '#123b34');
      skyGrad.addColorStop(0.78, '#081f1b');
      skyGrad.addColorStop(1, '#030d0b');
      skyCtx.fillStyle = skyGrad;
      skyCtx.fillRect(0, 0, 900, 1050);
      const skyTex = new THREE.CanvasTexture(skyCanvas);
      skyTex.colorSpace = THREE.SRGBColorSpace;
      scene.background = skyTex;

      const camera = new THREE.PerspectiveCamera(30, 900 / 1050, 0.1, 200);

      scene.add(new THREE.AmbientLight(0xffffff, 1.55));
      const hemi = new THREE.HemisphereLight(0xcffcf0, 0x1b3327, 1.1);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfff0c8, 2.4);
      sun.position.set(-7, 11, 6);
      scene.add(sun);

      const rim = new THREE.DirectionalLight(0x86ffd0, 0.72);
      rim.position.set(7, 5, -7);
      scene.add(rim);

      const fill = new THREE.DirectionalLight(0x9fd8ff, 0.6);
      fill.position.set(5, 2, 8);
      scene.add(fill);

      // mossy ground
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(7.2, 72),
        new THREE.MeshStandardMaterial({ color: 0x153a2c, roughness: 1, metalness: 0 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.015;
      scene.add(ground);

      // soft contact shadow
      const sc = document.createElement('canvas');
      sc.width = 512;
      sc.height = 512;
      const g = sc.getContext('2d');
      const grad = g.createRadialGradient(256, 256, 8, 256, 256, 250);
      grad.addColorStop(0, 'rgba(0,0,0,0.82)');
      grad.addColorStop(0.45, 'rgba(0,0,0,0.42)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 512, 512);
      const shadowTex = new THREE.CanvasTexture(sc);
      shadowTex.colorSpace = THREE.SRGBColorSpace;
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(7.4, 7.4),
        new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }),
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.002;
      scene.add(shadow);

      // ---- cinematic atmosphere -------------------------------------------------
      function radialTexture(stops, size = 256) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const x = c.getContext('2d');
        const rg = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        for (const [at, col] of stops) rg.addColorStop(at, col);
        x.fillStyle = rg;
        x.fillRect(0, 0, size, size);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const haloTex = radialTexture([
        [0, 'rgba(255,244,214,0.95)'],
        [0.16, 'rgba(255,222,158,0.62)'],
        [0.42, 'rgba(255,183,104,0.22)'],
        [0.72, 'rgba(255,154,82,0.06)'],
        [1, 'rgba(255,140,70,0)'],
      ]);
      const coreTex = radialTexture([
        [0, 'rgba(255,255,246,1)'],
        [0.3, 'rgba(255,242,204,0.92)'],
        [0.62, 'rgba(255,214,142,0.32)'],
        [1, 'rgba(255,196,110,0)'],
      ]);
      const softTex = radialTexture([
        [0, 'rgba(255,255,255,0.9)'],
        [0.34, 'rgba(255,255,255,0.4)'],
        [0.68, 'rgba(255,255,255,0.1)'],
        [1, 'rgba(255,255,255,0)'],
      ]);

      const sunGlow = new THREE.Group();
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: haloTex,
        color: new THREE.Color(1.5, 1.05, 0.55),
        transparent: true,
        opacity: 0.2,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        fog: false,
      }));
      halo.scale.setScalar(9.5);
      const sunCore = new THREE.Sprite(new THREE.SpriteMaterial({
        map: coreTex,
        color: new THREE.Color(2.4, 1.85, 1.0),
        transparent: true,
        opacity: 0.6,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        fog: false,
      }));
      sunCore.scale.setScalar(1.9);
      sunGlow.add(halo, sunCore);
      sunGlow.position.set(-3.2, 6.2, -9.0);
      scene.add(sunGlow);

      const mist = [];
      for (let i = 0; i < 7; i += 1) {
        const a = (i / 7) * Math.PI * 2 + 0.4;
        const r = 1.5 + (i % 3) * 0.55;
        const mat = new THREE.SpriteMaterial({
          map: softTex,
          color: new THREE.Color(0.55, 1.15, 1.0),
          transparent: true,
          opacity: 0.075 + (i % 2) * 0.015,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          fog: false,
        });
        const s = new THREE.Sprite(mat);
        s.position.set(Math.cos(a) * r, 0.26 + (i % 3) * 0.12, Math.sin(a) * r * 0.8);
        s.scale.set(4.2 + (i % 3) * 0.7, 1.45 + (i % 2) * 0.35, 1);
        s.userData = { x: s.position.x, phase: i * 1.7, sy: s.scale.y };
        mist.push(s);
        scene.add(s);
      }

      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(9173);
      const moteMats = [
        new THREE.SpriteMaterial({ map: softTex, color: new THREE.Color(1.7, 1.4, 0.8), transparent: true, opacity: 0.42, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }),
        new THREE.SpriteMaterial({ map: softTex, color: new THREE.Color(1.1, 1.5, 1.2), transparent: true, opacity: 0.28, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }),
        new THREE.SpriteMaterial({ map: softTex, color: new THREE.Color(1.4, 1.3, 1.1), transparent: true, opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }),
      ];
      const motes = [];
      for (let i = 0; i < 30; i += 1) {
        const a = rnd() * Math.PI * 2;
        const r = 1.15 + rnd() * 2.55;
        const s = new THREE.Sprite(moteMats[i % 3]);
        const scale = 0.022 + rnd() * 0.048;
        s.position.set(Math.cos(a) * r, 0.35 + rnd() * 4.3, Math.sin(a) * r * 0.75);
        s.scale.setScalar(scale);
        s.userData = {
          x: s.position.x,
          y: s.position.y,
          z: s.position.z,
          phase: rnd() * Math.PI * 2,
          sx: 0.22 + rnd() * 0.3,
          sy: 0.18 + rnd() * 0.4,
          sz: 0.16 + rnd() * 0.25,
          base: scale,
        };
        motes.push(s);
        scene.add(s);
      }

      function updateAtmosphere(t) {
        for (const s of motes) {
          const p = s.userData;
          s.position.set(
            p.x + Math.cos(t * p.sx + p.phase) * 0.22,
            p.y + Math.sin(t * p.sy + p.phase * 1.7) * 0.3,
            p.z + Math.sin(t * p.sz + p.phase * 0.6) * 0.16,
          );
          s.scale.setScalar(p.base * (0.72 + 0.28 * Math.sin(t * 1.15 + p.phase * 2.1)));
        }
        for (const s of mist) {
          const p = s.userData;
          s.position.x = p.x + Math.sin(t * 0.11 + p.phase) * 0.26;
          s.scale.y = p.sy * (1 + 0.06 * Math.sin(t * 0.3 + p.phase));
        }
        halo.material.opacity = 0.2 + 0.016 * Math.sin(t * 0.45);
      }
      updateAtmosphere(1.35);

      // ---- render pipeline ------------------------------------------------------
      const composer = new EffectComposer(renderer);
      composer.setSize(900, 1050);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(900, 1050), 0.32, 0.65, 1.35);
      composer.addPass(bloomPass);
      const gradePass = new ShaderPass({
        uniforms: { tDiffuse: { value: null } },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform sampler2D tDiffuse;
          varying vec2 vUv;
          void main() {
            vec4 color = texture2D(tDiffuse, vUv);
            vec2 d = vUv - vec2(0.5, 0.47);
            d.x *= 0.86;
            float edge = smoothstep(0.3, 0.86, length(d));
            color.rgb *= mix(1.0, 0.58, edge);
            color.rgb = mix(color.rgb, color.rgb * vec3(0.78, 1.08, 1.04), edge * 0.55);
            color.rgb *= vec3(1.025, 1.0, 0.97);
            gl_FragColor = color;
          }
        `,
      });
      composer.addPass(gradePass);
      composer.addPass(new OutputPass());
      function renderFrame() {
        composer.render();
      }

      const views = {
        hero: { pos: [5.3, 4.1, 9.1], target: [0, 2.6, 0], fov: 30 },
        front: { pos: [0, 3.2, 10.4], target: [0, 2.6, 0], fov: 30 },
        side: { pos: [10.2, 3.2, 0.6], target: [0, 2.6, 0], fov: 30 },
        low: { pos: [3.4, 1.9, 7.4], target: [0, 3.0, 0], fov: 33 },
        crown: { pos: [3.6, 5.6, 4.9], target: [0, 4.6, 0], fov: 30 },
        base: { pos: [2.8, 1.5, 4.6], target: [0, 0.75, 0], fov: 32 },
      };
      function setView(name) {
        const v = views[name] || views.hero;
        camera.fov = v.fov;
        camera.position.set(...v.pos);
        camera.lookAt(...v.target);
        camera.updateProjectionMatrix();
        renderFrame();
      }
      setView('hero');

      let model = null;
      let mixer = null;
      let clip = null;
      let action = null;

      window.__ready = false;
      window.__scene = scene;
      window.__camera = camera;
      window.__renderer = renderer;
      window.__THREE = THREE;
      window.__composer = composer;
      window.__setView = setView;
      window.__setTime = (t) => {
        if (mixer) {
          mixer.setTime(t % (clip ? clip.duration : 4));
        }
        updateAtmosphere(t);
        renderFrame();
      };

      const unlit = params.has('unlit');
      const loader = new GLTFLoader();
      loader.load(
        '/assets/vibrant_billboard_tree.glb',
        (gltf) => {
          model = gltf.scene;
          model.scale.setScalar(0.0205);
          model.position.y = 0;
          scene.add(model);

          let skinned = 0;
          let bones = 0;
          let tris = 0;
          const mats = new Set();
          model.traverse((o) => {
            if (o.isSkinnedMesh) skinned += 1;
            if (o.isBone) bones += 1;
            if (o.isMesh) {
              if (unlit && o.material && o.material.map) {
                const src = o.material;
                o.material = new THREE.MeshBasicMaterial({
                  map: src.map,
                  alphaTest: 0.5,
                  side: THREE.DoubleSide,
                  toneMapped: true,
                  name: src.name,
                });
              }
              tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
              if (o.material) mats.add(o.material.uuid);
            }
          });

          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());

          if (gltf.animations.length) {
            clip = gltf.animations[0];
            mixer = new THREE.AnimationMixer(model);
            action = mixer.clipAction(clip);
            action.setLoop(THREE.LoopRepeat, Infinity);
            action.play();
            mixer.setTime(0);
          }

          window.__info = {
            animations: gltf.animations.map((a) => ({ name: a.name, duration: a.duration, tracks: a.tracks.length })),
            skinnedMeshes: skinned,
            bones,
            triangles: Math.round(tris),
            materials: mats.size,
            size: size.toArray().map((v) => +v.toFixed(3)),
            box: { min: box.min.toArray().map((v) => +v.toFixed(2)), max: box.max.toArray().map((v) => +v.toFixed(2)) },
            trackNames: clip ? Array.from(new Set(clip.tracks.map((t) => t.name.split('.').slice(0, 2).join('.')))) : [],
          };

          updateAtmosphere(1.35);
          renderFrame();
          window.__ready = true;
        },
        undefined,
        (err) => {
          window.__error = String(err && err.message ? err.message : err);
        },
      );

      const clock = new THREE.Clock();
      window.__live = params.has('motion');
      function loop() {
        requestAnimationFrame(loop);
        if (window.__live) {
          const dt = Math.min(clock.getDelta(), 0.05);
          if (mixer) mixer.update(dt);
          updateAtmosphere(clock.elapsedTime);
          renderFrame();
        } else {
          clock.getDelta();
        }
      }
      loop();
    </script>
  </body>
</html>
